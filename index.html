<!DOCTYPE html>
<html lang="zh-TW" data-theme="dark">
<head>
  <script>
    window.onerror = function(message, source, lineno, colno, error) {
      const showErr = () => {
        const div = document.createElement('div');
        div.style.position = 'fixed';
        div.style.top = '0';
        div.style.left = '0';
        div.style.width = '100%';
        div.style.background = '#ef4444';
        div.style.color = '#ffffff';
        div.style.padding = '15px';
        div.style.zIndex = '99999';
        div.style.fontFamily = 'monospace';
        div.style.fontSize = '14px';
        div.style.whiteSpace = 'pre-wrap';
        div.innerHTML = '<b>[JS Error]</b> ' + message + '<br>Source: ' + source + '<br>Line: ' + lineno + ':' + colno + (error ? '<br>Stack: ' + error.stack : '');
        document.body.appendChild(div);
      };
      if (document.body) {
        showErr();
      } else {
        window.addEventListener('DOMContentLoaded', showErr);
      }
      return false;
    };

    window.addEventListener('unhandledrejection', function(event) {
      const showErr = () => {
        const div = document.createElement('div');
        div.style.position = 'fixed';
        div.style.top = '0';
        div.style.left = '0';
        div.style.width = '100%';
        div.style.background = '#ef4444';
        div.style.color = '#ffffff';
        div.style.padding = '15px';
        div.style.zIndex = '99999';
        div.style.fontFamily = 'monospace';
        div.style.fontSize = '14px';
        div.style.whiteSpace = 'pre-wrap';
        
        let msg = event.reason;
        if (event.reason && event.reason.stack) {
          msg = event.reason.message + '<br>Stack: ' + event.reason.stack;
        }
        div.innerHTML = '<b>[JS Promise Rejection Error]</b> ' + msg;
        document.body.appendChild(div);
      };
      if (document.body) {
        showErr();
      } else {
        window.addEventListener('DOMContentLoaded', showErr);
      }
    });
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AuraWrite | 專屬您的寫作空間</title>
  
  <!-- SEO & PWA Meta Tags -->
  <meta name="description" content="一個融合心情記錄、標籤分類、圖文與音檔的極致美學寫作空間。">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1a1a24">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Theme Flicker prevention immediate script -->
  <script>
    (function() {
      const savedTheme = localStorage.getItem('aurawrite-theme') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);
      const bg = savedTheme === 'dark' ? '#0a0a0f' : '#f3f4f6';
      document.write('<style>html,body{background-color:' + bg + ' !important;}</style>');
    })();
  </script>
  
  <!-- Lucide Icons -->
  <script src="lucide.min.js" defer></script>
  
  <!-- Supabase Client -->
  <script src="supabase.js" defer></script>
  
  <!-- Stylesheet -->
  <link rel="stylesheet" href="index.css?v=22">
</head>
<body>

    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>
  </div>

  <div class="app-container">

    <header class="app-header glass-panel animate-fade-in">
      <div class="header-logo">
        <i data-lucide="sparkles" class="logo-icon"></i>
        <h1>AuraWrite</h1>
      </div>
      
      <div class="header-actions">
        <button id="export-btn" class="icon-btn" title="匯出備份資料">
          <i data-lucide="download"></i>
        </button>
        <button id="import-btn" class="icon-btn" title="匯入備份資料">
          <i data-lucide="upload"></i>
        </button>
        <input type="file" id="import-file-input" class="hidden" accept=".json">

        <button id="theme-toggle" class="icon-btn" title="切換主題">
          <i data-lucide="sun" class="sun-icon"></i>
          <i data-lucide="moon" class="moon-icon"></i>
        </button>
        <button id="logout-btn" class="icon-btn hidden" title="登出雲端帳號">
          <i data-lucide="log-out"></i>
        </button>
        <button id="write-btn" class="primary-btn">
          <i data-lucide="pen-tool"></i>
          <span>開始寫作</span>
        </button>
      </div>
    </header>

    <!-- Main Content Grid -->
    <main class="app-main">
      <!-- Sidebar / Statistics -->
      <aside class="app-sidebar animate-slide-in-left">
        <div class="sidebar-widget glass-panel">
          <h3>寫作統計</h3>

            <div class="stat-card">
              <span class="stat-value" id="stat-total-count">0</span>
              <span class="stat-label">總文章數</span>
            </div>
            <div class="stat-card">
              <span class="stat-value" id="stat-streak">0</span>
              <span class="stat-label">連續天數</span>
            </div>
          </div>
        </div>

        <div class="sidebar-widget glass-panel animate-slide-in-left">
          <div class="widget-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
            <h3 style="margin: 0;">文章分類</h3>
            <button type="button" id="manage-categories-btn" class="icon-btn-small" title="管理分類" style="background: none; border: none; color: var(--text-secondary); cursor: pointer; padding: 4px; display: flex; align-items: center; border-radius: 6px; transition: background 0.2s;">
              <i data-lucide="settings" style="width: 16px; height: 16px;"></i>
            </button>
          </div>
          <div class="category-list" id="sidebar-category-list">
            <!-- Dynamically generated category items -->
          </div>
        </div>

        <div class="sidebar-widget glass-panel">
          <div class="widget-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
            <h3 style="margin: 0;">心情分佈</h3>
            <button type="button" id="manage-moods-btn" class="icon-btn-small" title="管理情緒" style="background: none; border: none; color: var(--text-secondary); cursor: pointer; padding: 4px; display: flex; align-items: center; border-radius: 6px; transition: background 0.2s;">
              <i data-lucide="settings" style="width: 16px; height: 16px;"></i>
            </button>
          </div>
          <div class="mood-chart" id="mood-chart-container">
            <!-- Dynamically generated mood statistics bars -->
          </div>
        </div>
      </aside>

      <!-- Writing Feed & Dashboard -->
      <section class="app-feed animate-slide-in-right">
        <!-- Mobile Writing Button (Visible only on mobile screen) -->
        <button id="write-btn-mobile" class="primary-btn glow-btn mobile-only-write-btn" style="width: 100%; height: 50px; border-radius: 14px; font-size: 1.05rem; font-weight: 700; margin-bottom: 1.25rem; display: none; justify-content: center; align-items: center; gap: 0.6rem; background: linear-gradient(135deg, var(--accent-primary) 0%, #a78bfa 100%); box-shadow: 0 4px 15px var(--accent-glow); border: none; color: #ffffff; cursor: pointer;">
          <i data-lucide="feather" style="width: 20px; height: 20px;"></i>
          <span>開始書寫今天...</span>
        </button>
        
        <!-- Search & Filters -->
        <div class="search-filter-section glass-panel">
          <div class="search-bar-container">
            <i data-lucide="search" class="search-icon"></i>
            <input type="text" id="search-input" placeholder="搜尋標題、內容或標籤...">
            <button id="search-clear-btn" class="clear-btn hidden"><i data-lucide="x"></i></button>
          </div>
          <div class="filter-tags-container category-filter-row" style="justify-content: space-between; align-items: center; width: 100%;">
            <div style="display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; flex: 1;">
              <span class="filter-label">文章分類：</span>
              <div class="tag-chips" id="filter-category-chips" style="display: inline-flex; gap: 0.5rem; flex-wrap: wrap;">
                <button class="tag-chip active" data-category="all">📁 全部文章</button>
              </div>
            </div>
            <button type="button" id="manage-categories-btn-mobile" class="icon-btn-small" title="管理分類" style="background: none; border: none; color: var(--text-secondary); cursor: pointer; padding: 4px; display: flex; align-items: center; border-radius: 6px;">
              <i data-lucide="settings" style="width: 15px; height: 15px;"></i>
            </button>
          </div>
          
          <div class="filter-tags-container" style="margin-top: 0.75rem;">
            <span class="filter-label">熱門標籤：</span>
            <div class="tag-chips" id="filter-tag-chips">
              <button class="tag-chip active" data-tag="all">全部</button>
            </div>
          </div>
        </div>

        <!-- Diary Entries Feed -->
        <div class="entries-timeline" id="entries-feed">
          <!-- Empty State (Fallback if no entries) -->
          <div class="empty-state glass-panel hidden" id="empty-state-view">
            <i data-lucide="feather" class="empty-icon"></i>
            <h3>還沒有任何紀錄</h3>
            <p>點擊右上角的「開始寫作」，記錄今天的生活點滴與靈感吧！</p>
          </div>
          
          <!-- Diary Cards will be loaded dynamically here -->
        </div>
      </section>
    </main>
  </div>

  <!-- Writing Editor Modal -->
  <div class="modal-overlay hidden" id="editor-modal">
    <div class="editor-container glass-panel">
      <!-- Modal Header -->
      <div class="editor-header">
        <h2 id="editor-modal-title">新紀錄</h2>
        <button id="editor-close-btn" class="icon-btn"><i data-lucide="x"></i></button>
      </div>

      <!-- Modal Body (Form) -->
      <form id="write-form" class="editor-form" autocomplete="off" onsubmit="event.preventDefault();">
        <input type="hidden" id="entry-id">
        
        <!-- Row 1: Title, Category, and Date -->
        <div class="form-row">
          <div class="form-group flex-2">
            <label for="entry-title">標題</label>
            <input type="text" id="entry-title" placeholder="為今天寫下一個獨特的標題..." required>
          </div>
          <div class="form-group flex-1">
            <label for="entry-category">文章分類</label>
            <div class="category-select-wrapper" style="display: flex; flex-direction: column; gap: 0.5rem;">
              <select id="entry-category" style="width: 100%; background: rgba(0, 0, 0, 0.2); border: 1px solid var(--border-color); border-radius: 10px; padding: 0.75rem 1rem; color: var(--text-primary); font-family: var(--font-body); font-size: 0.95rem; outline: none; transition: all 0.3s; cursor: pointer;">
                <option value="生活隨筆">生活隨筆</option>
                <option value="靈感創作">靈感創作</option>
                <option value="工作學習">工作學習</option>
                <option value="讀書筆記">讀書筆記</option>
                <option value="旅行雜記">旅行雜記</option>
                <option value="custom">+ 新增分類...</option>
              </select>
              <div id="custom-category-group" class="hidden" style="display: flex; gap: 0.5rem; width: 100%;">
                <input type="text" id="entry-category-emoji" placeholder="圖標 (如 🌲)" style="width: 90px; text-align: center; background: rgba(0, 0, 0, 0.2); border: 1px solid var(--border-color); border-radius: 10px; padding: 0.75rem 0.5rem; color: var(--text-primary); font-size: 1rem; outline: none;">
                <input type="text" id="entry-category-custom" placeholder="自訂分類名稱..." style="flex: 1; background: rgba(0, 0, 0, 0.2); border: 1px solid var(--border-color); border-radius: 10px; padding: 0.75rem 1rem; color: var(--text-primary); font-size: 0.95rem; outline: none;">
              </div>
            </div>
          </div>
          <div class="form-group flex-1">
            <label for="entry-date">日期</label>
            <input type="date" id="entry-date" required>
          </div>
        </div>

        <!-- Row 1.5: Location Tracker -->
        <div class="form-row">
          <div class="form-group flex-1">
            <label for="entry-location">📍 記錄地點</label>
            <div class="location-input-wrapper">
              <input type="text" id="entry-location" placeholder="正在獲取定位，或可自行輸入地點...">
              <button type="button" class="gps-btn" id="location-gps-btn" title="手動獲取定位">
                <i data-lucide="locate"></i>
              </button>
            </div>
          </div>
        </div>

        <!-- Row 2: Mood Selector (Multi-select) -->
        <div class="form-row">
          <div class="form-group flex-1">
            <label>今日狀態心情 (可複選)</label>
            <div class="mood-selection-grid" id="editor-moods-container">
              <!-- Dynamically populated mood checkboxes -->
            </div>
          </div>
        </div>

        <!-- Row 3: Tags Input -->
        <div class="form-group">
          <label>標籤分類 (按 Enter 新增)</label>
          <div class="tag-input-container">
            <div class="editor-tags-list" id="editor-tags-list">
              <!-- Dynamically added editor tags -->
            </div>
            <input type="text" id="tag-text-input" placeholder="輸入標籤，如 #日記 #點滴 ...">
          </div>
        </div>

        <!-- Block Editor Container -->
        <div class="form-group block-editor-group">
          <label>文章內容與混排排版</label>
          <div class="block-editor-container" id="block-editor-container">
            <!-- List of blocks will be rendered here dynamically -->
            <div id="editor-blocks-list" class="editor-blocks-list"></div>
            
            <!-- Add Block floating toolbox -->
            <div class="block-toolbox">
              <span class="toolbox-title">新增排版區塊：</span>
              <div class="toolbox-buttons">
                <button type="button" class="tool-btn" data-type="text" title="新增文字段落">
                  <i data-lucide="align-left"></i>
                  <span>文字</span>
                </button>
                <button type="button" class="tool-btn" data-type="image" title="插入圖片區塊">
                  <i data-lucide="image"></i>
                  <span>圖片</span>
                </button>
                <button type="button" class="tool-btn" data-type="video" title="插入影片區塊">
                  <i data-lucide="video"></i>
                  <span>影片</span>
                </button>
                <button type="button" class="tool-btn" data-type="audio" title="插入音檔/錄音">
                  <i data-lucide="mic"></i>
                  <span>語音</span>
                </button>
                <button type="button" class="tool-btn" data-type="link" title="插入網頁連結卡片">
                  <i data-lucide="link"></i>
                  <span>網頁連結</span>
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- Form Actions -->
        <div class="editor-actions">
          <button type="button" id="form-cancel-btn" class="secondary-btn">取消</button>
          <button type="submit" id="form-save-btn" class="primary-btn glow-btn">
            <i data-lucide="save"></i>
            <span>儲存上傳</span>
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Manage Moods Modal -->
  <div class="modal-overlay hidden" id="moods-modal">
    <div class="modal-content glass-panel" style="max-width: 450px;">
      <div class="modal-header">
        <h2>管理心情選項</h2>
        <button class="close-btn" id="moods-modal-close">&times;</button>
      </div>
      <div class="modal-body" style="padding: 1.5rem 0 0.5rem 0;">
        <!-- Add New Mood -->
        <form id="add-mood-form" style="display: flex; gap: 0.5rem; margin-bottom: 1.5rem; align-items: flex-end;">
          <div style="width: 70px; display: flex; flex-direction: column; gap: 0.35rem;">
            <label for="new-mood-emoji" style="font-size: 0.85rem; color: var(--text-secondary);">表情</label>
            <input type="text" id="new-mood-emoji" placeholder="😊" required maxlength="4" style="text-align: center; height: 42px; border-radius: 8px; border: 1px solid var(--border-color); background: rgba(255,255,255,0.05); color: var(--text-primary); font-size: 1.25rem;">
          </div>
          <div style="flex: 1; display: flex; flex-direction: column; gap: 0.35rem;">
            <label for="new-mood-name" style="font-size: 0.85rem; color: var(--text-secondary);">心情名稱</label>
            <input type="text" id="new-mood-name" placeholder="興奮" required style="height: 42px; border-radius: 8px; border: 1px solid var(--border-color); background: rgba(255,255,255,0.05); color: var(--text-primary); padding: 0 0.75rem; font-size: 0.95rem;">
          </div>
          <button type="submit" class="primary-btn glow-btn" style="height: 42px; padding: 0 1.25rem;">新增</button>
        </form>
        
        <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 1.5rem 0;">
        
        <!-- Current Moods List -->
        <label style="margin-bottom: 0.75rem; display: block; font-size: 0.9rem; font-weight: 500;">目前心情列表 (可點擊刪除鍵移除)</label>
        <div id="moods-list-container" style="max-height: 250px; overflow-y: auto; display: flex; flex-direction: column; gap: 0.5rem;">
          <!-- Dynamically populated moods -->
        </div>
      </div>
    </div>
  </div>

  <!-- Manage Categories Modal -->
  <div class="modal-overlay hidden" id="categories-modal" style="z-index: 180;">
    <div class="modal-content glass-panel" style="max-width: 450px;">
      <div class="modal-header" style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 0.75rem;">
        <h2 style="margin: 0; font-family: var(--font-title); font-size: 1.4rem;">管理文章分類</h2>
        <button class="close-btn" id="categories-modal-close" style="background: none; border: none; color: var(--text-secondary); font-size: 1.5rem; cursor: pointer;">&times;</button>
      </div>
      <div class="modal-body" style="padding: 1.25rem 0 0.25rem 0;">
        <!-- Add New Category -->
        <form id="add-category-form" style="display: flex; gap: 0.5rem; margin-bottom: 1.5rem; align-items: flex-end;">
          <div style="width: 70px; display: flex; flex-direction: column; gap: 0.35rem;">
            <label for="new-cat-emoji" style="font-size: 0.85rem; color: var(--text-secondary);">表情</label>
            <input type="text" id="new-cat-emoji" placeholder="📁" required maxlength="4" style="text-align: center; height: 42px; border-radius: 8px; border: 1px solid var(--border-color); background: rgba(255,255,255,0.05); color: var(--text-primary); font-size: 1.25rem; outline: none;">
          </div>
          <div style="flex: 1; display: flex; flex-direction: column; gap: 0.35rem;">
            <label for="new-cat-name" style="font-size: 0.85rem; color: var(--text-secondary);">分類名稱</label>
            <input type="text" id="new-cat-name" placeholder="工作學習" required style="height: 42px; border-radius: 8px; border: 1px solid var(--border-color); background: rgba(255,255,255,0.05); color: var(--text-primary); padding: 0 0.75rem; font-size: 0.95rem; outline: none;">
          </div>
          <button type="submit" class="primary-btn glow-btn" style="height: 42px; padding: 0 1.25rem; font-size: 0.9rem;">新增</button>
        </form>
        
        <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 1.25rem 0;">
        
        <!-- Current Categories List -->
        <label style="margin-bottom: 0.75rem; display: block; font-size: 0.85rem; font-weight: 500; color: var(--text-secondary);">目前分類列表 (點擊鉛筆修改文字，垃圾桶可刪除)</label>
        <div id="categories-list-container" style="max-height: 250px; overflow-y: auto; display: flex; flex-direction: column; gap: 0.5rem; padding-right: 4px;">
          <!-- Dynamically populated categories -->
        </div>
      </div>
    </div>
  </div>

  <!-- Auth Modal (Cloud Login) -->
  <div class="modal-overlay" id="auth-modal" style="z-index: 200;">
    <div class="card editor-container" style="max-width: 400px; padding: 2rem;">
      <div class="modal-header" style="justify-content: center; border-bottom: 0; padding-bottom: 0.5rem;">
        <div style="text-align: center;">
          <i data-lucide="sparkles" style="width: 42px; height: 42px; color: var(--accent-primary); margin-bottom: 0.75rem; filter: drop-shadow(0 0 10px rgba(99, 102, 241, 0.4));"></i>
          <h2 style="font-family: var(--font-title); font-size: 1.6rem; font-weight: 800; background: linear-gradient(135deg, #ffffff 0%, #a5b4fc 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">歡迎使用 AuraWrite</h2>
          <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 0.25rem;">登入您的專屬雲端寫作空間</p>
        </div>
      </div>
      <div class="modal-body" style="padding-top: 1rem;">
        <!-- Error message display -->
        <div id="auth-error-msg" class="hidden" style="background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: #f87171; border-radius: 8px; padding: 0.75rem; font-size: 0.85rem; margin-bottom: 1rem; text-align: center;"></div>
        
        <form id="auth-form" style="display: flex; flex-direction: column; gap: 1rem;">
          <div style="display: flex; flex-direction: column; gap: 0.35rem;">
            <label for="auth-email" style="font-size: 0.85rem; color: var(--text-secondary); font-weight: 500;">電子信箱 (Email)</label>
            <input type="email" id="auth-email" placeholder="example@email.com" required style="height: 44px; border-radius: 8px; border: 1px solid var(--border-color); background: rgba(255,255,255,0.05); color: var(--text-primary); padding: 0 0.85rem; font-size: 0.95rem; outline: none; transition: border-color 0.25s;">
          </div>
          <div style="display: flex; flex-direction: column; gap: 0.35rem;">
            <label for="auth-password" style="font-size: 0.85rem; color: var(--text-secondary); font-weight: 500;">密碼 (Password)</label>
            <input type="password" id="auth-password" placeholder="請輸入 6 位數以上的密碼" required minlength="6" style="height: 44px; border-radius: 8px; border: 1px solid var(--border-color); background: rgba(255,255,255,0.05); color: var(--text-primary); padding: 0 0.85rem; font-size: 0.95rem; outline: none; transition: border-color 0.25s;">
          </div>
          
          <!-- Submit Actions -->
          <div style="display: flex; flex-direction: column; gap: 0.75rem; margin-top: 1rem;">
            <button type="submit" id="auth-submit-btn" class="primary-btn glow-btn" style="height: 44px; width: 100%; justify-content: center; font-size: 0.95rem;">
              <span>登入</span>
            </button>
